name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-app:
    name: Build App
    runs-on: ubuntu-latest
    env:
      storyteller_f_sign_key: ${{ secrets.SIGNING_KEY }}
      storyteller_f_sign_alias: ${{ secrets.ALIAS }}
      storyteller_f_sign_store_password: ${{ secrets.STORE_PASSWORD }}
      storyteller_f_sign_key_password: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Build release APK
        run: ./gradlew :giant-explorer:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: giant-explorer-release
          path: giant-explorer/build/outputs/apk/release/*.apk

  build-plugins:
    name: Build Plugins
    runs-on: ubuntu-latest
    env:
      storyteller_f_sign_key: ${{ secrets.SIGNING_KEY }}
      storyteller_f_sign_alias: ${{ secrets.ALIAS }}
      storyteller_f_sign_store_password: ${{ secrets.STORE_PASSWORD }}
      storyteller_f_sign_key_password: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Build li plugin
        run: ./gradlew :plugins:li:li-plugin:assembleRelease

      - name: Build yue plugin
        run: ./gradlew :plugins:yue:yue-plugin:assembleRelease

      - name: Build yue-html
        run: bash plugins/yue-html/dispatch.sh

      - name: Upload li plugin
        uses: actions/upload-artifact@v4
        with:
          name: li-plugin-release
          path: plugins/li/li-plugin/build/outputs/aar/*.aar

      - name: Upload yue plugin
        uses: actions/upload-artifact@v4
        with:
          name: yue-plugin-release
          path: plugins/yue/yue-plugin/build/outputs/aar/*.aar

      - name: Upload yue-html
        uses: actions/upload-artifact@v4
        with:
          name: yue-html-release
          path: build/yue-html/*.zip

  publish:
    name: Publish to Maven
    runs-on: ubuntu-latest
    needs: [build-app, build-plugins]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Publish to MavenLocal
        run: ./gradlew :giant-explorer-plugin-core:publishToMavenLocal

      - name: Publish to Maven Central
        if: success()
        run: ./gradlew :giant-explorer-plugin-core:publish
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
